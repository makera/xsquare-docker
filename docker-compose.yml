x-shared-build-args: &build-args
  LIBRE_OFFICE_VER: "25.8.4.2"
  DEMO: "true"
  DB_HOST: "db"
  PGHS_HOST: "pghs:8888"
  XRAD_HOST: "xrad:8889"
  XREPORTS_HOST: "xreports:8886"

volumes:
  postgres-db-volume:

services:
  db:
    build:
      dockerfile: Dockerfile
      target: db
      args:
        <<: *build-args
    restart: always
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pghs:
    build:
      dockerfile: Dockerfile
      target: pghs
      args:
        <<: *build-args
    depends_on:
      db:
        condition: service_healthy
    restart: always

  xrad:
    build:
      dockerfile: Dockerfile
      target: xrad
      args:
        <<: *build-args
    depends_on:
      db:
        condition: service_healthy
    restart: always

  xdac:
    build:
      dockerfile: Dockerfile
      target: xdac
      args:
        <<: *build-args
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8887:8887

  xreports:
    build:
      dockerfile: Dockerfile
      target: xreports
      args:
        <<: *build-args
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      dockerfile: Dockerfile
      target: nginx
      args:
        <<: *build-args
    ports:
      - 80:80
      - 8080:8080
    depends_on:
      - pghs
      - xrad
